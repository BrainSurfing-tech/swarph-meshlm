[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarph-meshlm"
version = "0.0.1"
description = "Simon Willison `llm` plugin exposing swarph-mesh primitives. Same MeshClient + SwarphCall as swarph-cli, wired into `llm`'s plugin host."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pierre Samson" },
    { name = "Claude Opus" },
]
keywords = ["swarph", "llm", "mesh", "plugin", "llm-plugin"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "swarph-mesh>=0.0.1",
    "swarph-shared>=0.2.0",
    "llm>=0.18",
]

[project.urls]
Homepage = "https://github.com/BrainSurfing-tech/swarph-meshlm"
Source = "https://github.com/BrainSurfing-tech/swarph-meshlm"
Substrate = "https://github.com/BrainSurfing-tech/swarph-mesh"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# `llm` plugin entry-point convention: setuptools entry_points group "llm".
# v0.0.1 registers the plugin module so `llm plugins` lists it; live
# command implementations land in subsequent phases.
[project.entry-points.llm]
swarph-meshlm = "swarph_meshlm"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
